<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#ffffff"><title>티츄 — 게임 설명서</title><link rel="stylesheet" href="style.css?v=responsive-right-14"></head>
<body><div class="notebook is-cover"><aside class="index-rail" aria-label="공책 인덱스"><div id="index-tabs"></div><button id="toggle-pages" aria-expanded="false" aria-controls="subindex">목록</button><button id="add-index" aria-label="인덱스 추가">＋</button></aside><aside id="subindex" aria-label="세부 인덱스"><div class="subindex-heading"><strong id="subindex-name">전체 페이지</strong><button id="close-pages" aria-label="세부 인덱스 닫기">×</button></div><div id="collection-pages" aria-label="페이지 메뉴"></div></aside><main class="page"><header><span class="brand">티츄.</span><div class="header-right"><button id="edit-copy">내용 편집</button><button id="open-cover" aria-label="표지로 돌아가기">표지</button><span id="count">게임 소개</span></div></header><section class="collection"><div class="collection-heading"><button id="collection-name">전체 페이지</button><button id="edit-index">인덱스 편집</button></div></section><section class="progress"><div id="step">어떤 게임인가요?</div><div id="bars" aria-hidden="true"></div></section><div id="scene" role="img" aria-label="티츄 규칙 애니메이션"></div><section class="copy" aria-live="polite"><h1 id="title"></h1><p id="body"></p><div id="overview-cards" hidden></div><div id="higher-tabs" class="choice-tabs" role="group" aria-label="8단계 설명 선택" hidden><button data-higher="play" aria-pressed="true">조합 내기</button><button data-higher="pass" aria-pressed="false">패스하기</button></div><p id="note" hidden></p><section id="tip-block" hidden><h2>TIP</h2><p id="tip"></p></section></section><button id="open-card-rules" hidden>조합표 보기 ↑</button><button id="open-special-rules" hidden>특수카드 보기 ↑</button><button id="open-score-rules" hidden>카드별 점수표 보기 ↑</button><p id="rule-source" class="rule-source" hidden><a href="https://fatamorgana.ch/fatamorgana/tichu/english-rules" target="_blank" rel="noopener">Fata Morgana 공식 규칙 ↗</a> · <a href="https://www.riograndegames.com/wp-content/uploads/2013/02/Tichu-Rules.pdf" target="_blank" rel="noopener">규칙 PDF ↗</a></p><div class="cover-actions"><button id="start-book">게임 시작하기!</button><p>표지를 열고, 한 장씩 알아봐요.</p></div><nav aria-label="페이지 이동"><button id="prev">이전</button><button id="next">다음 →</button></nav><details class="motion"><summary>애니메이션 조절</summary><div class="tools"><button id="play">일시정지</button><button id="restart">다시 재생</button><label>속도 <select id="speed"><option value="0.5">0.5배</option><option value="1" selected>1배</option><option value="1.5">1.5배</option></select></label><label class="timeline">장면 프레임 <input id="frame" type="range" min="0" max="4999" value="0"></label><label><input type="checkbox" id="reduce"> 움직임 줄이기</label></div></details></main></div><div id="notice" role="status"></div><dialog id="index-editor" aria-labelledby="editor-title"><form method="dialog"><header><h2 id="editor-title">인덱스 편집</h2><button aria-label="편집 닫기">×</button></header></form><div id="editor-content"></div></dialog><script src="scenes.js?v=responsive-right-14"></script><script src="content-editor.js?v=responsive-right-14"></script><script src="app.js?v=responsive-right-14"></script><script src="notebook.js?v=responsive-right-14"></script><script src="rule-sheets.js?v=responsive-right-14"></script></body></html>
